[project]
name = "skailar-ai"
version = "0.0.1"
description = "Official Python SDK for the Skailar API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Skailar" }]
keywords = ["skailar", "llm", "ai", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://skailar.com"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skailar"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/skailar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
