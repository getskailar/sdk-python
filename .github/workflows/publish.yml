name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src/skailar

      - name: Test
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skailar-ai
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC); no API token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted Publishing (OIDC): no PYPI_TOKEN secret. Configure this repo,
      # workflow (publish.yml) and environment (pypi) as a Trusted Publisher for
      # the `skailar-ai` project at https://pypi.org/manage/account/publishing/.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
